# Render blueprint. A persistent disk and outbound SMTP both need a PAID instance (starter or higher).
# Email without SMTP: set Email__Provider=Brevo and Email__ApiKey (HTTPS, works on any plan); leave Email__Host empty.
services:
  - type: web
    name: uncovering-greatness-crm
    runtime: docker
    plan: starter
    autoDeploy: false          # deployments are triggered by the GitHub Actions pipeline (.github/workflows/cd.yml) after the tests pass
    healthCheckPath: /healthz
    disk:
      name: crm-data
      mountPath: /app/App_Data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__TrustForwardedHeaders      # required behind Render's HTTPS proxy
        value: "true"
      - key: Seed__SampleData
        value: "false"
      - key: Seed__MustChangePassword
        value: "true"
      # Initial sign-in passwords for the four seeded users. Render asks for these when the blueprint is created, so the
      # defaults in appsettings.json (public in GitHub) are never used in production. Each must meet the password policy
      # (12+ characters, upper, lower, digit and symbol). Everyone is forced to change theirs at first sign-in.
      - key: Seed__Users__0__Password
        sync: false
      - key: Seed__Users__1__Password
        sync: false
      - key: Seed__Users__2__Password
        sync: false
      - key: Seed__Users__3__Password
        sync: false
      - key: App__PublicBaseUrl                   # e.g. https://uncovering-greatness-crm.onrender.com or your own domain
        sync: false
      - key: Email__Provider                      # "Brevo" to send over HTTPS instead of SMTP
        sync: false
      - key: Email__ApiKey                        # Brevo API key (only for Email__Provider=Brevo)
        sync: false
      - key: Email__Host
        sync: false
      - key: Email__Port
        value: "587"
      - key: Email__UseSsl
        value: "true"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: Uncovering Greatness
